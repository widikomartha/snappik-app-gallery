name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: snappik_test
          POSTGRES_USER: snappik
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U snappik -d snappik_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_DATABASE: snappik_test
      DB_USERNAME: snappik
      DB_PASSWORD: ci-only-password
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, mbstring, intl, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: composer validate --strict
      - run: composer lint
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: composer test
      - run: php artisan migrate --force
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
